version: "3.3"

volumes:
  movelweb:


services:
  seirios-mongo:
    image: library/mongo:4.4.4
    container_name: seirios-mongo
    restart: always
    network_mode: host
    volumes:
      - movelweb:/data/db
  seirios-rabbitmq:
    image: library/rabbitmq:3.8.12-management
    container_name: seirios-rabbitmq
    restart: always
    network_mode: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /home/$USER/catkin_ws/movel_ai/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
  seirios-redis:
    image: library/redis:6.2.0
    container_name: seirios-redis
    restart: always
    network_mode: host
    command: bash -c "redis-server --notify-keyspace-events KEA"
  seirios-frontend:
    image: movelrobots/rns-frontend:4.36.0-alpha
    container_name: seirios-frontend
    restart: always
    network_mode: host
    depends_on:
      - seirios-backend
    environment:
      THREE_D_MAPPING: "true"
      START_FROM_NEAREST: "true"
      MULTI_MAP: "true"
      AUTO_MAPPING: "true"
      RSTP_STREAM: "false"
      # HIDE_POINT_CLOUD_LIDAR: "false"
      # AUX_TASK: "false"
      MULTI_SESSION: "true"
      # SHOW_3D_VIEW: "true"
      CUSTOM_MESSAGE: "true"
      SET_INFLATION_LAYER: "true"  
      # MAX_LINEAR_SPD: 1.5
      # MAX_ANGULAR_SPD: 1.5
      # TARGET_TELEOP: "true"
    volumes:
      - /home/$USER/catkin_ws/movel_ai/Downloads/:/home/movel/Downloads/:rw
  seirios-backend:
    image: movelrobots/rns-backend:4.36.0-alpha
    container_name: seirios-backend
    restart: always
    network_mode: host
    volumes:
      - /var/hasplm:/var/hasplm:rw
      - /etc/hasplm:/etc/hasplm:rw
      - /home/$USER/catkin_ws/movel_ai/maps:/home/movel/maps:rw
      - /home/$USER/catkin_ws/movel_ai/paths:/home/movel/paths:rw
      - /home/$USER/catkin_ws/movel_ai/maps/nav:/home/movel/navigation:rw
      - /home/$USER/catkin_ws/movel_ai/Downloads/export:/home/movel/Downloads/export:rw
      - /home/$USER/catkin_ws/movel_ai/Downloads/import:/home/movel/Downloads/import:rw
      - /home/$USER/catkin_ws/movel_ai/Downloads/:/home/movel/Downloads/:rw
    depends_on:
      - seirios-mongo
      - seirios-rabbitmq
      # environment:
      # ZERO_ROLL_PITCH: "true"
      # THREE_D_MAPPING: "true"
      # SHOW_3D_VIEW: "true"
      # CUSTOM_MESSAGE: "/custom_msg_test"
  seirios-backend-worker:
    image: movelrobots/rns-backend-worker:3.3.0
    container_name: seirios-backend-worker
    restart: always
    network_mode: host
    depends_on:
      - seirios-mongo
      - seirios-rabbitmq
      - seirios-backend
  seirios-ros:
    image: movelrobots/rns-ros:2.66.6
    container_name: seirios-ros
    network_mode: "host"
    restart: always
    # ports:
    #   - 1947:1947   # hasp
    environment:
      DISPLAY: ":0"
      QT_X11_NO_MITSHM: 1
      QT_GRAPHICSSYSTEM: native
      ROSCONSOLE_STDOUT_LINE_BUFFERED: 1 # flush INFO logs immediately
      AUX_MODE: "old"
      MOVEL_MOVE_BASE: "true"
      TASK_SUPERVISOR_FALLBACK: "false"
      ZONE_COVERAGE: "false"
      CART_FOOTPRINT_PUBLISHER: "false"
    # devices:
    #   - /dev/snd:/dev/snd   # audio
    # group_add:
    #   - audio
    volumes:
      - /var/hasplm:/var/hasplm:rw
      - /etc/hasplm:/etc/hasplm:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/udev:/etc/udev:rw
      - /home/$USER/catkin_ws/movel_ai/maps:/home/movel/.config/movel/maps:rw
      - /home/$USER/catkin_ws/movel_ai/paths:/home/movel/.config/movel/paths:rw
      - /home/$USER/catkin_ws/movel_ai/config:/home/movel/.config/movel/config:rw
      - /home/$USER/catkin_ws/movel_ai/backup:/home/movel/.config/movel/backup:rw
      - /home/$USER/catkin_ws/movel_ai/aux_tasks:/home/movel/.config/movel/aux_tasks:rw
      - /home/$USER/catkin_ws/movel_ai/logs:/home/movel/.config/movel/logs:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # - /home/$USER/.ssh/id_rsa:/home/movel/.ssh/id_rsa:ro
      # - /home/$USER/catkin_ws/movel_ai/ros_entrypoint.sh:/ros_entrypoint.sh:rw
      # - /home/$USER/catkin_ws/movel_ai/kdlidar_ros:/home/movel/kdlidar_ros:rw
    depends_on:
      - seirios-redis
    entrypoint: bash -c 'source /ros_entrypoint.sh && roslaunch movel start.launch'
    # entrypoint: bash -c 'source /ros_entrypoint.sh && roslaunch movel start_nots.launch'
    # entrypoint: bash -c 'source /ros_entrypoint.sh && roslaunch movel start_3d.launch'
    # entrypoint: bash -c 'source /ros_entrypoint.sh && roslaunch movel start_rtabmap.launch obstacles_scan:=scan'
    # entrypoint: bash -c 'source /ros_entrypoint.sh && tail -f /dev/null'

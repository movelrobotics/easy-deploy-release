DWAPlannerROS:
  controller_frequency: 20.0

  max_vel_x: 1.5 #0.5
  min_vel_x: -0.001 #-0.001 #must not be zero
  #max_trans_vel: 0.3 #0.5
  #min_trans_vel: 0.1
  max_vel_trans: 1.5 #0.3 #0.5
  min_vel_trans: 0.1
  min_in_place_vel_theta: 0.2
  max_vel_theta: 1.5 #2.0
  min_vel_theta: -1.5 #-2.0
  max_rot_vel: 1.5 #1.5
  min_rot_vel: 0.2
  max_vel_y: 0.0 
  min_vel_y: -0.0 

  # trans_stoppped_vel: 0.1
  # rot_stopped_vel: 0.1 

  acc_lim_theta: 20.0 #10.0 #6.0
  acc_lim_th: 20.0 #10.0 #6.0
  acc_lim_x: 20.0 #2.5 #5.0
  acc_limit_trans: 2.5 #5.0
  acc_lim_y: 0.0

  #forward simulation parameters
  sim_time: 2.5  #3.0 The amount of time to forward-simulate trajectories in seconds
  sim_granularity: 0.025 #0.025
  angular_sim_granularity: 0.025 #0.1
  vx_samples: 15 #15
  vtheta_samples: 31
  vth_samples: 31 #31
  vy_samples: 0

  #Trajectory scoring parameters
  path_distance_bias: 44.0 #44, 32.0, 30.0
  goal_distance_bias: 30.0 #36, 24.0, 26.0
  occdist_scale: 0.05 #0.01 
  twirling_scale: 0.0 #Penalize changes in robot heading
  forward_point_distance: 0.325 #0.325 (in meters)
  stop_time_buffer: 0.1 #0.1
  scaling_speed: 0.25 #0.2
  max_scaling_factor: 0.2 

  #oscillation prevention parameters
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2

  #goal tolerance parameters
  yaw_goal_tolerance: 0.2 #0.1
  xy_goal_tolerance: 0.2 #0.05
  latch_xy_goal_tolerance: true #true

  holonomic_robot: false

  dwa: true
  use_dwa: true
  prune_plan: false 
  publish_cost_grid: true

PebbleLocalPlanner:
  d_min: 0.30
  robot_frame: base_link
  map_frame: map
  xy_goal_tolerance: 0.08
  xy_goal_tolerance_exit: 0.2
  yaw_goal_tolerance: 0.1
  
  kp_linear: 1.0
  ki_linear: 0.0
  kd_linear: 0.0
  
  kp_angular: 1.0
  ki_angular: 0.0
  kd_angular: 0.1

  max_vel_x: 0.8
  max_vel_theta: 0.3
  min_vel_x: 0.0
  min_vel_theta: 0.0
  acc_lim_x: 1.0
  acc_lim_theta: 1.0
  allow_reverse: false
  th_turn: 1.0472 #1.0472 : 60 deg, how far the robot faces from the waypoint before suppressing linear motion
  local_obstacle_avoidance: false # whether to let the local planner do obsav. If false, rely on the global planner, and planning frequency must not be zero
  N_lookahead: 3 # how many multiples of d_min to look ahead when eval'ing obstacles

  decelerate_goal: false
  decelerate_distance: 1.5
  decelerate_factor: 1.0
  decelerate_each_waypoint: false
  curve_angle_tolerance: 2.5
  curve_d_min: 0.1
  curve_vel: 0.1
  
  enable_efficient_goal_rotation: false 
  consider_circumscribed_lethal: true
  use_accurate_rotation: false 
  accurate_rotate_threshold: 1.39626
  accurate_th_turn: 0.175

EBandPlannerROS:
  Ctrl_Rate: 20.0
  bubble_velocity_multiplier: 13.0
  costmap_weight: 50.0
  differential_drive: true
  disallow_hysteresis: false
  eband_equilibrium_approx_max_recursion_depth: 4
  eband_equilibrium_relative_overshoot: 0.75
  eband_external_force_gain: 2.0
  eband_internal_force_gain: 1.0
  eband_min_relative_overlap: 0.9
  eband_significant_force_lower_bound: 0.15
  eband_tiny_bubble_distance: 0.01
  eband_tiny_bubble_expansion: 0.01
  in_place_trans_vel: 0.0
  k_damp: 2.5
  k_prop: 0.5
  marker_lifetime: 0.5
  max_acceleration: 0.5
  max_rotational_acceleration: 0.6
  max_translational_acceleration: 0.5
  max_vel_lin: 0.75
  max_vel_th: 0.5
  min_in_place_vel_th: 0.0
  min_vel_lin: 0.1
  min_vel_th: 0.0
  num_iterations_eband_optimization: 3
  rot_stopped_vel: 0.01
  rotation_correction_threshold: 0.5
  rotation_threshold_multiplier: 1.0
  trans_stopped_vel: 0.01
  virtual_mass: 0.75
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  
TebLocalPlannerROS:

  odom_topic: /odom
  map_frame: map
      
  # Trajectory
    
  teb_autosize: True
  dt_ref: 0.2 #0.2
  dt_hysteresis: 0.02
  global_plan_overwrite_orientation: True
  max_global_plan_lookahead_dist: 0.50 #3.0
  feasibility_check_no_poses: 10
    
  # Robot
          
  max_vel_x: 0.20 #0.25 
  max_vel_x_backwards: 0.11 #0.2
  max_vel_theta: 0.7854 #0.5
  acc_lim_x: 0.1
  acc_lim_theta: 0.1 #0.5, 0.26
  min_turning_radius: 0.0
  footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
    type: "polygon" #"circular" 
    radius: 0.38 # for type "circular"
    #line_start: [-0.3, 0.0] # for type "line"
    #line_end: [0.3, 0.0] # for type "line"
    #front_offset: 0.2 # for type "two_circles"
    #front_radius: 0.2 # for type "two_circles"
    #rear_offset: 0.2 # for type "two_circles"
    #rear_radius: 0.2 # for type "two_circles"
    vertices: [ [0.135, 0.135], [0.135, -0.135], [-0.135, -0.135], [-0.135,0.135] ] # waffle3"
    #vertices: [ [0.4, 0.3], [0.4, -0.3], [-0.4, -0.3], [-0.4, 0.3] ] # waffle4"

  # GoalTolerance
      
  xy_goal_tolerance: 0.1 #0.2
  yaw_goal_tolerance: 0.1745
  free_goal_vel: False
      
  # Obstacles
      
  min_obstacle_dist: 0.15
  inflation_dist: 0.45
  dynamic_obstacle_inflation_dist: 0.05
  include_costmap_obstacles: True
  costmap_obstacles_behind_robot_dist: 0.5
  obstacle_poses_affected: 25 #30
  obstacle_association_force_inclusion_factor: 4
  obstacle_association_cutoff_factor: 8
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: True
  costmap_converter_rate: 5

  # Optimization
      
  no_inner_iterations: 3 #5
  no_outer_iterations: 2 #4
  optimization_activate: True
  optimization_verbose: False
  penalty_epsilon: 0.001
  weight_max_vel_x: 2 #2
  weight_max_vel_theta: 1 #1
  weight_acc_lim_x: 1 # 1
  weight_acc_lim_theta: 1 # 1
  weight_kinematics_nh: 1000 #1000
  weight_kinematics_forward_drive: 1000 #1000
  weight_kinematics_turning_radius: 1000 #1 #only for car-like robots
  weight_optimaltime: 100.0 #1
  weight_obstacle: 100.0 #50
  weight_viapoint: 10.0 #5.0 #1.0
  weight_inflation: 0.1 #0.1
  weight_dynamic_obstacle: 10 # not in use yet
  selection_alternative_time_cost: False # not in use yet

  # Homotopy Class Planner

  enable_homotopy_class_planning: False #True
  enable_multithreading: True
  simple_exploration: False
  max_number_classes: 2 #4
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_keypoint_offset: 0.1
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: False

  #ViaPoints
  global_plan_viapoint_sep: 0.25 #-3.5 #0.5 #negative if none
  via_points_ordered: False #adhere to order of via points

  #Feedback
  publish_feedback: true #false

RegPurePursuitPlanner:
  transform_tolerance: 0.3

  xy_goal_tolerance: 0.30
  yaw_goal_tolerance: 0.785
  max_vel_x: 1.5
  max_vel_theta: 0.785

  use_velocity_scaled_lookahead_dist: true
  lookahead_dist: 1.5
  min_lookahead_dist: 1.0
  max_lookahead_dist: 10.0
  lookahead_time: 5.0

  min_approach_linear_velocity: 0.05

  use_regulated_linear_velocity_scaling: false
  regulated_linear_scaling_min_speed: 0.25
  regulated_linear_scaling_min_radius: 6.0

  use_cost_regulated_linear_velocity_scaling: false
  inflation_cost_scaling_factor: 3.0

  cost_scaling_dist: 0.3
  cost_scaling_gain: 1.0

  use_rotate_to_heading: true
  rotate_to_heading_min_angle: 0.785
  rotate_to_heading_angular_vel: 1.8
  max_angular_accel: 3.2

  max_allowed_time_to_collision_up_to_carrot: 2.0
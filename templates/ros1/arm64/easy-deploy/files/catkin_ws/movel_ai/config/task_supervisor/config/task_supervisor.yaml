  watchdog_timeout: 0.0
  loop_rate: 5 #10
  odom_topic: "/odom"
  disable_smoother: true
  use_pre_external_service: false
  pre_external_service: "/charge_station/pin_up"       # uncomment if use_pre_external_service is true
  pre_external_cancel_topic:  "/test_cancel"           # uncomment if use_pre_external_service is true
  use_post_external_service: false
  # post_external_service: "/lift_fork"                # uncomment if use_post_external_service is true
  # post_external_cancel_topic: "/test_cancel"         # uncomment if use_post_external_service is true
  dock: true
  use_external_feedback: false #true
  feedback_timeout: 5.0
  #external_topic: "/external_feedback"  # uncomment if use_external_feedback is true
  internal_topic: "/movel_diff_drive_docking/success"
  pause_service: "/movel_diff_drive_docking/pause"

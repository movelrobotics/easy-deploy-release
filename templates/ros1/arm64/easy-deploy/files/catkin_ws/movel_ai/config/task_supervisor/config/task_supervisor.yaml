  # post_external_cancel_topic: "/test_cancel"    # uncomment if use_post_external_service is true
  dock: false
  undocking_distance: 1.0
  undocking_speed: -0.1

movel_docking:
  watchdog_rate: 2.0
  watchdog_timeout: 0.0
  loop_rate: 10
  odom_topic: "/odom"
  use_external_service: false #true
  disable_smoother: true
  disable_basefootprint: false # by default -> navigasi : base_footprint, docking : base_link
  enable_basefootprint: false

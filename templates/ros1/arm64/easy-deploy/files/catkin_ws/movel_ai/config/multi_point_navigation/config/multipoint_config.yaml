multi_point_map:
  # footprint: [[0.210,0.350],[0.210,-0.350],[-0.680,-0.350],[-0.680,0.350]]
  footprint: [ [0.135, 0.135], [0.135, -0.135], [-0.135, -0.135], [-0.135,0.135] ] # waffle 3
  # footprint: [[0.125,0.3],[0.125,-0.3],[-0.675,-0.3],[-0.675,0.3]]
  # footprint: [[0.210,0.340],[0.210,-0.340],[-0.680,-0.340],[-0.680,0.340]]
  #footprint: [[0.45,0.38],[0.45,-0.38],[-0.43,-0.38],[-0.43,0.38]]

  footprint_padding: 0.0 #0.25
  map_type: voxel
  track_unknown_space: false
  transform_tolerance: 1.0
  
  obstacle_layer:
      origin_z: -0.1
      z_resolution: 1.8 #1.5 This must be higher than the z coordinate of the mounted lidar
      z_voxels: 1 
      obstacle_range: 10.0 #10.0
      raytrace_range: 15.0 #15.0
      observation_sources: laser_scan_sensor #point_cloud_sensor
      observation_persistence: 0.0
      #unknown_threshold: 1
      #mark_threshold: 0
      max_obstacle_height: 2.0
      track_unknown_space: false 
      
      laser_scan_sensor: {data_type: LaserScan, topic: /scan/filtered, marking: true, clearing: true, min_obstacle_height: 0.00, max_obstacle_height: 3.00, inf_is_valid: true}
      # point_cloud_sensor: {sensor_frame: laser_link, data_type: PointCloud2, topic: /lidar_point_cloud/filtered, marking: true, clearing: true, min_obstacle_height: -1.0, max_obstacle_height: 1.00}

  lowbstacle_layer:
      enabled: true
      origin_z: -0.15
      z_resolution: 1.8
      z_voxels: 1
      unknown_threshold: 1
      obstacle_range: 10.0    #3.5 #if beyond this threshold, then will not mark as obstacle
      raytrace_range: 15.0  #5.0 Lower this value to detect nearer obstacles with better accuracy
      observation_sources: mock_scan #butt_scan1 butt_scan2
      publish_voxel_map: true
      track_unknown_space: false
      lethal_cost_threshold: 170
      unknown_cost_value: 255
      unknown_threshold: 15
      inf_is_valid: true
      #obs_cloud:
         # data_type: PointCloud2
         # topic: /obstacles_cloud
         #  marking: true
         # clearing: false
         # min_obstacle_height: -0.01
         #  max_obstacle_height: 0.99
          #sensor_frame: base_link
          
      mock_scan:
          data_type: LaserScan
          topic: /obstacles_scan
          marking: true
          clearing: true
          min_obstacle_height: -0.15
          max_obstacle_height: 1.00
          inf_is_valid: true
          #sensor_frame: base_link
          
  inflation_layer:
      enabled: true
      cost_scaling_factor: 1.0 #added in by John
      inflation_radius: 0.45 #0.45 #0.7 #0.45 #0.475 #0.45 #Minimum value: 0.379

  global_frame: map
  robot_base_frame: base_link
  
  update_frequency: 1.0
  publish_frequency: 1.0
  static_map: false
  rolling_window: true
  width: 14   #10.0   #10.0
  height: 14  #10.0  #10.0
  resolution: 0.05 #0.01
  always_send_full_costmap: true
  plugins:
    - {name: lowbstacle_layer, type: "costmap_2d::VoxelLayer"}
    - {name: obstacle_layer, type: "costmap_2d::VoxelLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

# obstruction_threshold: Minimum costmap value considered an obstacle.
obstruction_threshold: 90
# base_frame: Reference frame for velocity limits (base_link).
base_frame: "base_link"
# merging_frame: Frame used for cloud merging (odom).
merging_frame: "odom"
# publish_pcl: Whether to publish point clouds (true).
publish_pcl: true
# grid_resolution: Resolution of velocity grids (0.05).
grid_resolution: 0.05
# low_pass_gain: Gain for smoothing velocity limits (0.1). - Not used
low_pass_gain: 1.0
# cloud_persistence: Maximum time a point cloud is valid (0.5s).
cloud_persistence: 0.5
# stop_timeout: Time to pause tasks after stoppage (autonomous safety) (5.0s).
stop_timeout: 20.0
# initial_limit_set: Default profile for autonomous mode ("default").
initial_limit_set: "default"
# safe_teleop_limit_set: Default profile for teleop mode ("default_safe_teleop").
safe_teleop_limit_set: "default_safe_teleop"
zone_sets:
  default:
    zones:
      - type: "linear"
        direction: "positive"
        dimension: "x"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              # First and last point of list need to be equal
              # You need to close the polygon by making the last point the same as the first point. So the correct coordinates should be:
              # x_coordinates: [ 0.6, 0.6, -0.6,  0.6,  0.6]
              # y_coordinates: [ 0.4, -0.4, -0.4, 0.4, 0.4]
              x_coordinates: [ 0.5, 0.5, 0.00,  0.00,  0.5]
              y_coordinates: [-0.4, 0.4, 0.4, -0.4, -0.4]
      # # if the robot allow reverse in the navigation
      # - type: "linear"
      #   direction: "negative"
      #   dimension: "x"
      #   frontiers:
      #     - inclusion: 0
      #       value: 0.0
      #       shape:
      #         x_coordinates: [-0.5, -0.5, 0.00,  0.00, -0.5]
      #         y_coordinates: [-0.4,  0.4, 0.4, -0.4, -0.4]
      - type: "angular"
        direction: "positive"
        dimension: "z"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [0.5, 0.5, -0.5, -0.5, 0.5]
              y_coordinates: [0.4,-0.4, -0.4,  0.4, 0.4]
      - type: "angular"
        direction: "negative"
        dimension: "z"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [0.5, 0.5, -0.5, -0.5, 0.5]
              y_coordinates: [0.4,-0.4, -0.4,  0.4, 0.4]
  default_safe_teleop:
    zones:
      - type: "linear"
        direction: "positive"
        dimension: "x"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [ 0.5, 0.5, 0.00,  0.00,  0.5]
              y_coordinates: [-0.4, 0.4, 0.4, -0.4, -0.4]
      - type: "linear"
        direction: "negative"
        dimension: "x"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [-0.5, -0.5, 0.00,  0.00, -0.5]
              y_coordinates: [-0.4,  0.4, 0.4, -0.4, -0.4]
      - type: "angular"
        direction: "positive"
        dimension: "z"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [0.5, 0.5, -0.5, -0.5, 0.5]
              y_coordinates: [0.4,-0.00, -0.00,  0.4, 0.4]
              # y_coordinates: [0.5,-0.5, -0.5,  0.5, 0.5] #if want to make a square - same for angular positive and negative
      - type: "angular"
        direction: "negative"
        dimension: "z"
        frontiers:
          - inclusion: 0
            value: 0.0
            shape:
              x_coordinates: [0.5, 0.5, -0.5, -0.5, 0.5]
              y_coordinates: [0.0,-0.4, -0.4,  0.0, 0.0]
              # y_coordinates: [0.5,-0.5, -0.5,  0.5, 0.5] #if want to make a square - same for angular positive and negative
validation:
  base_frame:
    allowed: ["base", "base_link"]
  grid_resolution:
    min: 0.0
  low_pass_gain:
    min: 0.0
    max: 1.0
  max_linear:
    min: 0.0
  max_angular:
    min: 0.0
